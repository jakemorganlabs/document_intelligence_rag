# Cloudflare Tunnel config: MICT-RAG-002 S06
#
# Reference only. cloudflared on the VPS reads its config from TUNNEL_TOKEN.
# The intended ingress rules are documented here for the operator.
#
# Expected ingress (deployed via Cloudflare dashboard / cloudflared CLI):
#   docs.jakemorganlabs.dev/query  -> http://n8n:5678/webhook/query
#   docs.jakemorganlabs.dev/health -> http://n8n:5678/webhook/health
#   everything else                -> 404

tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: docs.jakemorganlabs.dev
    path: /query
    service: http://n8n:5678/webhook/query

  - hostname: docs.jakemorganlabs.dev
    path: /health
    service: http://n8n:5678/webhook/health

  - hostname: docs.jakemorganlabs.dev
    service: http_status:404

  # default 404 for all unmatched traffic
  - service: http_status:404
