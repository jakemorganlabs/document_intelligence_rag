name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    # Surface a single coherent test check rather than overlapping with build.
    # Required repository secrets (Settings > Secrets and variables > Actions):
    #   - GOOGLE_GENAI_API_KEY      (Google AI Studio key for Gemma generation)
    #   - EMBEDDING_PROVIDER_API_KEY (OpenAI key for text-embedding-3-small)
    #   - DATABASE_URL              (Postgres+pgvector connection string — optional for CI)
    #   - QUERY_SECRET              (HMAC secret for query auth — S05)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python sidecar dependencies
        run: pip install -r sidecar/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Run unit tests (no live APIs)
        run: npm test
        env:
          # When the real secret is absent, fall back to the placeholder-skipped
          # sentinel. The test suite recognises this sentinel and skips live
          # API tests hermetically rather than timing out against the network.
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY || 'placeholder-skipped' }}
          EMBEDDING_PROVIDER_API_KEY: ${{ secrets.EMBEDDING_PROVIDER_API_KEY || 'placeholder-skipped' }}