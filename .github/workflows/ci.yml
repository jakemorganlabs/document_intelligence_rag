name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    # Surface a single coherent test check rather than overlapping with build.
    # Optional repository secrets (Settings > Secrets and variables > Actions):
    #   - DEEPINFRA_API_KEY         (DeepInfra key; enables the live embedder test)
    #   - EMBEDDING_PROVIDER_API_KEY (same key under the embedder's env name)
    # DATABASE_URL is not a secret here: the job runs its own pgvector service
    # so the migrations and every DB-touching test execute on every push.

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docintel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python sidecar dependencies
        run: pip install -r sidecar/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Run migrations against the CI database
        run: npm run migrate:fresh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/docintel_test

      - name: Run unit tests
        run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/docintel_test
          # When the real secret is absent, fall back to the placeholder-skipped
          # sentinel. The test suite recognises this sentinel and skips live
          # API tests hermetically rather than timing out against the network.
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY || secrets.GOOGLE_GENAI_API_KEY || 'placeholder-skipped' }}
          EMBEDDING_PROVIDER_API_KEY: ${{ secrets.EMBEDDING_PROVIDER_API_KEY || 'placeholder-skipped' }}
